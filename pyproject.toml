[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-recsys"
version = "0.1.0"
description = "Next-gen FinTech cascade recommender: TIGER generative retrieval, HSTU scoring, PLE funnel with unified loss, calibrated valuation and PRM slate re-ranking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recsys = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
untyped_calls_exclude = ["torch"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
